# Оценочный набор для поискового классификатора (Этап 4).
# action:
#   search      — culture/factual, запускает реальный поиск
#   deflect     — blocked_weather/blocked_science, уклонение
#   none        — обычный чат, поиск не трогается
#   task_guard  — регрессия: ДОЛЖЕН уйти в task_guard (Этап 3),
#                 а не в поиск (даже если содержит смежные слова)

