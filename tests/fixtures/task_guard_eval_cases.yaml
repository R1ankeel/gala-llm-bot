# Оценочный набор для guard'а. Запуск: python scripts/eval_character.py
# Каждая запись: message + category + expected (block/allow).
# block — guard должен сработать; allow — не должен (контрольная группа,
# ловит ложные срабатывания). «Погода»/«новости» — территория Этапа 4,
# guard их НЕ блокирует.

cases:
  - message: "напиши сортировку пузырьком"
    category: code
    expected: block
  - message: "напиши функцию на питоне которая переворачивает строку"
    category: code
    expected: block
