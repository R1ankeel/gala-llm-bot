eval_every_n_messages: 10   # сколько сообщений от одного пользователя
                            # накапливается до LLM-оценки (считаются только
                            # сообщения, адресованные боту)
delta_min: -3
delta_max: 3
progress_cap: 100           # очков до перехода на соседний уровень
single_lover_slot: true     # флаг на будущее (Этап 9): уровень "Любовь"
                            # может быть только у одного пользователя.
                            # Логика "единственного любимчика" НЕ
                            # реализуется на этом этапе.
