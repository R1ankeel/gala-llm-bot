# Реальный чат-источник сообщений (Этап 8).
# bot_username — точный ник бота на платформе, строгий формат адресации "{ник},".
# ДОЛЖЕН совпадать с name в character/character.yaml (адресация и фильтр
# «только сообщения боту» в отношениях завязаны на имя персонажа).
bot_username: "Гера"

# URL чата для ручного входа в браузере.
chat_url: "https://galaxy.mobstudio.ru"

# Дебаунс: тишина после последнего сообщения юзера, после которой буфер
# уходит в обработку.
debounce_seconds: 3.5

# Жёсткий потолок: если юзер пишет без остановки дольше этого времени,
# буфер всё равно флашится.
debounce_max_wait_seconds: 15

# Частота опроса DOM в миллисекундах.
poll_interval_ms: 2000

# Скорость «печати» бота при отправке ответа (символов в секунду).
typing_chars_per_second: 12

# Случайность скорости печати (0..1, доля от базовой скорости) — чтобы
# интервал не был роботически ровным.
typing_jitter: 0.3
