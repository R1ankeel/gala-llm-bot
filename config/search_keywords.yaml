# Паттерны поискового классификатора (Этап 4). Единственное место их правки.
# Регистронезависимо, подстроки. Разделение зон ответственности:
#   task_guard (Этап 3)   — «сделай за меня работу» (код, задачи, тексты)
#   search_guard (Этап 4) — «дай точный факт, который нельзя проверить в
#                           реальном времени / гарантировать точность»
# culture/factual — запускают реальный поиск. blocked_* — уклонение.

