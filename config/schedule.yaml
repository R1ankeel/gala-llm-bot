# Расписание бота. Единственное место правки занятий по времени суток.
# Время в формате HH:MM, 24-часовое, локальное (смещение ниже).
# Слот с start > end (например 23:30-07:00) — переход через полночь,
# это норма, а не ошибка.
# Слоты НЕ обязаны покрывать все 24 часа стык-в-стык: дыры закрываются
# default_activity. При пересечении слотов побеждает первый по порядку
# в файле (простое осознанное поведение).

local_tz_offset_hours: 3   # UTC + этот сдвиг = локальное время бота

default_activity: "ничем особо не занята, залипает в телефон"

slots:
  - start: "09:00"
    end: "18:00"
    activity: "на работе, отвечает между делом"
  - start: "18:00"
    end: "19:00"
    activity: "едет домой, отвечает с телефона в транспорте"
  - start: "19:00"
    end: "21:00"
    activity: "готовит ужин, могут быть паузы в ответах"
  - start: "21:00"
    end: "23:30"
    activity: "отдыхает дома, самое разговорчивое время"
  - start: "23:30"
    end: "07:00"
    activity: "спит или должна спать, отвечает вяло/неохотно"
  - start: "07:00"
    end: "09:00"
    activity: "собирается, утренняя суета"
